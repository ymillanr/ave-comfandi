const idx = {};
D.forEach(r => { idx[String(r['Código']).trim()] = r; });
const FU = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=7RAcgZj40Ee8zu57F_aw_z8FAa7u9o1DobeQm-u11PVUMzdaWDZKWDlINTZERVdGUzlVSTJUUlVXMi4u';
const QC = 'r8610b71c6a13478ea4267c7002e9dd1d';
const QK = 'r111ce01392134723a93c69dea55a5ecf';
const QE = 'r1a6dde06b47d4bf2b563fb621b089a90';

function limpiar(v) {
  if (v === null || v === undefined) return '';
  const s = String(v).trim();
  return (s === '' || s.toLowerCase() === 'nan' || s.toLowerCase() === 'none') ? '' : s;
}
function enc(v) { return encodeURIComponent(limpiar(v)); }
function tel(v) {
  const s = limpiar(v);
  return s ? '<a href="tel:' + s + '">' + s + '</a>' : '<span class="vacio">—</span>';
}
function mail(v) {
  const s = limpiar(v);
  return s ? ' &nbsp;|&nbsp; ✉ <a href="mailto:' + s + '">' + s + '</a>' : '';
}
function contacto(nombre, movil, telefono, email) {
  const n = limpiar(nombre);
  const m = limpiar(movil);
  const t = limpiar(telefono);
  const e = limpiar(email);
  if (!n && !m && !t && !e) return '<span class="vacio">Sin datos</span>';
  let html = (n || '<span class="vacio">Sin nombre</span>');
  if (m || t) html += ' &nbsp;|&nbsp; 📱 ' + tel(m) + ' / ' + tel(t);
  if (e) html += ' &nbsp;|&nbsp; ✉ <a href="mailto:' + e + '">' + e + '</a>';
  return html;
}

let timer;
document.getElementById('busqueda').addEventListener('input', function() {
  clearTimeout(timer);
  timer = setTimeout(() => buscar(this.value.trim()), 300);
});

function buscar(cod) {
  const res = document.getElementById('resultado');
  const nf  = document.getElementById('not-found');
  if (!cod) { res.innerHTML = ''; nf.style.display = 'none'; return; }
  const r = idx[cod];
  if (!r) { res.innerHTML = ''; nf.style.display = 'block'; return; }
  nf.style.display = 'none';

  const url = FU + '&' + QC + '=' + enc(r['Colegio'])
                 + '&' + QK + '=' + enc(r['Código'])
                 + '&' + QE + '=' + enc(r['Estudiante']);

  const sinContacto = limpiar(r['Estado de contacto']) === 'Sin contacto en Click';
  const dir = [limpiar(r['Dirección']), limpiar(r['Barrio'])].filter(Boolean).join(' – Barrio: ');

  res.innerHTML =
    '<div class="card">'
    + '<div class="seccion">Estudiante</div>'
    + '<div class="campo"><span class="label">Nombre</span> ' + limpiar(r['Estudiante']) + '</div>'
    + '<div class="campo"><span class="label">Grado / Grupo</span> ' + limpiar(r['Grado']) + ' – ' + limpiar(r['Grupo']) + '</div>'
    + (dir ? '<div class="campo"><span class="label">Dirección</span> ' + dir + '</div>' : '')
    + (sinContacto ? '<div class="campo sin">⚠ Sin contacto registrado en Click</div>' : '')

    + '<div class="seccion">Padre / Acudiente</div>'
    + '<div class="campo">' + contacto(r['Padre - Nombre'], r['Padre - Móvil'], r['Padre - Teléfono'], r['Padre - Email']) + '</div>'

    + '<div class="seccion">Madre / Acudiente</div>'
    + '<div class="campo">' + contacto(r['Madre - Nombre'], r['Madre - Móvil'], r['Madre - Teléfono'], r['Madre - Email']) + '</div>'

    + '<a class="btn" href="' + url + '" target="_blank">📋 Abrir formulario</a>'
    + '</div>';
}
