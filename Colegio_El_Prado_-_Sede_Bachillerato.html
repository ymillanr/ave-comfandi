    + '<div class="campo"><span class="label">Estudiante</span> ' + r['Estudiante'] + '</div>'
    + '<div class="campo"><span class="label">Grado / Grupo</span> ' + r['Grado'] + ' ' + r['Grupo'] + '</div>'
    + '<div class="campo"><span class="label">Padre</span> '
      + (r['Padre - Nombre'] || '—')
      + ' &nbsp;|&nbsp; Móvil: ' + tel(r['Padre - Móvil'])
      + ' / Fijo: ' + tel(r['Padre - Teléfono']) + '</div>'
    + '<div class="campo"><span class="label">Madre</span> '
      + (r['Madre - Nombre'] || '—')
      + ' &nbsp;|&nbsp; Móvil: ' + tel(r['Madre - Móvil'])
      + ' / Fijo: ' + tel(r['Madre - Teléfono']) + '</div>'
    + (sin ? '<div class="campo sin">⚠ Sin contacto registrado en Click</div>' : '')
    + '<a class="btn" href="' + url + '" target="_blank">📋 Abrir formulario</a>'
    + '</div>';
}
</script>
</body>
