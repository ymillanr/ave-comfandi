  if (v === null || v === undefined) return '';

function enc(v) { return encodeURIComponent(limpiar(v)); }

    + '<div class="seccion">Estudiante</div>'
    + '<div class="campo"><span class="label">Nombre</span> ' + limpiar(r['Estudiante']) + '</div>'
    + '<div class="campo"><span class="label">Grado / Grupo</span> ' + limpiar(r['Grado']) + ' – ' + limpiar(r['Grupo']) + '</div>'
    + (dir ? '<div class="campo"><span class="label">Dirección</span> ' + dir + '</div>' : '')
    + (sinContacto ? '<div class="campo sin">⚠ Sin contacto registrado en Click</div>' : '')

    + '<div class="seccion">Padre / Acudiente</div>'
    + '<div class="campo">' + contacto(r['Padre - Nombre'], r['Padre - Móvil'], r['Padre - Teléfono'], r['Padre - Email']) + '</div>'

    + '<div class="seccion">Madre / Acudiente</div>'
    + '<div class="campo">' + contacto(r['Madre - Nombre'], r['Madre - Móvil'], r['Madre - Teléfono'], r['Madre - Email']) + '</div>'

    + '<a class="btn" href="' + url + '" target="_blank">📋 Abrir formulario</a>'
    + '</div>';
}
</script>
</body>
</html>
