const QK = 'r111ce01392134723a93c69dea55a5ecf';
const QE = 'r1a6dde06b47d4bf2b563fb621b089a90';
function enc(v) { return encodeURIComponent(v || ''); }
function tel(v) {
  return v ? '<a href="tel:' + v + '">' + v + '</a>' : '<span class="sin">—</span>';
}
let timer;
document.getElementById('busqueda').addEventListener('input', function() {
  clearTimeout(timer);
  timer = setTimeout(() => buscar(this.value.trim()), 300);
});
function buscar(cod) {
  const res = document.getElementById('resultado');
  const nf  = document.getElementById('not-found');
  if (!cod) { res.innerHTML = ''; nf.style.display = 'none'; return; }
  const r = idx[cod];
  if (!r) { res.innerHTML = ''; nf.style.display = 'block'; return; }
  nf.style.display = 'none';
  const url = FU + '&' + QC + '=' + enc(r['Colegio'])
                 + '&' + QK + '=' + enc(r['Código'])
                 + '&' + QE + '=' + enc(r['Estudiante']);
  const sin = r['Estado de contacto'] === 'Sin contacto en Click';
  res.innerHTML =
    '<div class="card">'
    + '<div class="campo"><span class="label">Estudiante</span> ' + r['Estudiante'] + '</div>'
    + '<div class="campo"><span class="label">Grado / Grupo</span> ' + r['Grado'] + ' ' + r['Grupo'] + '</div>'
    + '<div class="campo"><span class="label">Padre</span> '
      + (r['Padre - Nombre'] || '—')
      + ' &nbsp;|&nbsp; Móvil: ' + tel(r['Padre - Móvil'])
      + ' / Fijo: ' + tel(r['Padre - Teléfono']) + '</div>'
    + '<div class="campo"><span class="label">Madre</span> '
      + (r['Madre - Nombre'] || '—')
      + ' &nbsp;|&nbsp; Móvil: ' + tel(r['Madre - Móvil'])
      + ' / Fijo: ' + tel(r['Madre - Teléfono']) + '</div>'
    + (sin ? '<div class="campo sin">⚠ Sin contacto registrado en Click</div>' : '')
    + '<a class="btn" href="' + url + '" target="_blank">📋 Abrir formulario</a>'
    + '</div>';
}
